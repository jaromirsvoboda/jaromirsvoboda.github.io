name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  PANDOC_VERSION: "3.11"
  PANDOC_SHA256: 37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks and pandoc
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          curl -sSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo pandoc.tgz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          printf '%s  gitleaks.tgz\n%s  pandoc.tgz\n' "$GITLEAKS_SHA256" "$PANDOC_SHA256" | sha256sum -c
          tar -xzf gitleaks.tgz -C bin gitleaks
          tar -xzf pandoc.tgz --strip-components=2 -C bin "pandoc-${PANDOC_VERSION}/bin/pandoc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install what the leak scan needs to read PDFs and images
        run: sudo apt-get install -y -q poppler-utils python3-pil

      - name: Leak scan
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: |
          [ -n "$LEAK_PATTERNS" ] || { echo "::error::LEAK_PATTERNS secret is not set"; exit 1; }
          printf '%s\n' "$LEAK_PATTERNS" > "$RUNNER_TEMP/leak-patterns"
          LEAK_PATTERNS_FILE="$RUNNER_TEMP/leak-patterns" scripts/leak-scan

      - name: Build
        run: scripts/build _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
